
name: Build NEXZORA ESPORTS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - esports-2-0-update

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Generate Android app icon (Shilpa Dresses method)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets
          convert -background none public/nexzora-esports-icon.svg -resize 1024x1024 -gravity center -extent 1024x1024 assets/icon.png
          test -s assets/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#080808'
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXZORA-ESPORTS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
