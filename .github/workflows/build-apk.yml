name: Build NEXZORA ESPORTS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - nexzora-premium-release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Apply NEXZORA launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            folder="${spec%%:*}"
            size="${spec##*:}"
            rsvg-convert -w "$size" -h "$size" public/nexzora-esports-icon.svg > "android/app/src/main/res/$folder/ic_launcher.png"
            cp "android/app/src/main/res/$folder/ic_launcher.png" "android/app/src/main/res/$folder/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/res/mipmap-anydpi-v26
          rsvg-convert -w 432 -h 432 public/nexzora-esports-icon.svg > android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/black" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXZORA-ESPORTS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
